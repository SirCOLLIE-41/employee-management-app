<!DOCTYPE html>
<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT FORM </title>
    <link rel="stylesheet" href="style.css">
   

</head>
<body>
    <form id="contactForm">
        <fieldset>
            <legend>CONTACT FORM</legend>
            <!--full name-->
            <label>full name:</label><br>
            <input type="text" id="name" placeholder="enter your full name" required><br><br>
            <!--email address-->
            <label>email address:</label><br>
            <input type="email" id="email" placeholder="johndoe@gmail.com" required><br><br>
            <!--phone number-->
            <label>phone number:</label><br>
            <input type="text" id="phone" placeholder="+254 741....." required><br><br>
            <!--department-->
            <label>select department:</label><br>
            <select id="department">
                <option>Human Resource (HR) Department</option>
                <option>Finance Department</option>
                <option>Marketing Department</option>
                <option>Sales Department</option>
                <option>Information Technology (IT) Department</option>
            </select><br><br>
            <!--position-->
            <label>select position:</label><br>
            <select id="position">
                <option>manager</option>
                <option>supervisor</option>
                <option>accountant</option>
                <option>Human Resource Officer</option>
                <option>IT Technician</option><br><br>
            </select><br><br>
            <input type="submit" value="Save Contact">








 </fieldset>

 </form>
 <script src="main.js"></script>

</body>
</html>
